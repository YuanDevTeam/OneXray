org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Avoid cross-drive cache failures when the Windows Pub cache and project
# are on different drives.
kotlin.incremental=false
# Preserve the app-level 64-bit ABI list instead of Flutter's default list.
disable-abi-filtering=true
# Upstream in_app_review still applies legacy KGP. Keep Flutter's supported
# compatibility mode until official dependencies support built-in Kotlin/new DSL.
android.builtInKotlin=false
android.newDsl=false

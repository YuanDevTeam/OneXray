#
# Creates a multi-architecture MSIX bundle from Windows x64 and arm64 packages
# produced by a manually selected successful Build run and uploads it as a
# GitHub Actions artifact for manual submission to Microsoft Partner Center.
#
# Trigger:
#   - workflow_dispatch only
#

name: Publish Microsoft Store

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build workflow run id containing Windows Store artifacts
        required: true
        type: string

concurrency:
  group: publish-microsoft-store-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Download build metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: artifacts/release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Download Microsoft Store packages
        uses: actions/download-artifact@v8
        with:
          pattern: windows-store-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Select Microsoft Store packages from the Build run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          tag_args=()
          if [ -f artifacts/release-metadata/tag.txt ]; then
            metadata_tag="$(cat artifacts/release-metadata/tag.txt)"
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$metadata_tag" --jq '.sha')"
            tag_args=(--tag "$metadata_tag" --tag-sha "$tag_sha")
          fi
          python build_scripts/verify_release.py artifacts build-run.json \
            --windows-only "${tag_args[@]}" > store-files.txt

      - name: Create multi-architecture MSIX bundle
        shell: pwsh
        run: |
          $inputDirectory = New-Item -ItemType Directory -Path "bundle-input"
          Get-Content -LiteralPath "store-files.txt" | ForEach-Object {
            Move-Item -LiteralPath $_ -Destination $inputDirectory.FullName
          }
          $windowsSdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $makeAppx = Get-ChildItem $windowsSdkBin -Filter "MakeAppx.exe" -Recurse -File |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          & $makeAppx bundle /d $inputDirectory.FullName /p OneXray.msixbundle /o

      - name: Upload Microsoft Store bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-bundle
          path: OneXray.msixbundle
          if-no-files-found: error

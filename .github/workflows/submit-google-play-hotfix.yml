name: Submit verified Google Play hotfix
on:
  push:
    branches: [fix-26.10.4-android-startup]
    paths: [.github/workflows/submit-google-play-hotfix.yml]
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install official Google API client
        run: python -m pip install --disable-pip-version-check google-api-python-client
      - name: Submit existing verified production changes
        env:
          PLAY_SERVICE_JSON_BASE64: ${{ secrets.ANDROID_PLAY_SERVICE_JSON_BASE64 }}
        run: |
          python - <<'PY'
          import base64, json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          package = 'net.yuandev.onexray'
          info = json.loads(base64.b64decode(os.environ['PLAY_SERVICE_JSON_BASE64']))
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/androidpublisher'])
          edits = build('androidpublisher', 'v3', credentials=credentials, cache_discovery=False).edits()
          edit_id = edits.insert(packageName=package, body={}).execute()['id']
          committed = False
          try:
              track = edits.tracks().get(packageName=package, editId=edit_id, track='production').execute()
              releases = track.get('releases', [])
              assert len(releases) == 1, 'Unexpected production release count'
              release = releases[0]
              codes = sorted(map(int, release.get('versionCodes', [])))
              assert codes == [469], 'Refusing to submit a different production binary'
              assert release.get('name') == '26.10.4', 'Unexpected release name'
              assert release.get('status') == 'completed', 'Unexpected rollout state'
              locales = sorted(note['language'] for note in release.get('releaseNotes', []))
              assert locales == ['en-US', 'ru-RU', 'zh-CN'], 'Missing release-note language'
              edits.validate(packageName=package, editId=edit_id).execute()
              edits.commit(packageName=package, editId=edit_id,
                           changesInReviewBehavior='ERROR_IF_IN_REVIEW').execute()
              committed = True
              result = dict(package=package, versionCodes=codes, releaseName=release['name'],
                            locales=locales, committed=True, binaryUploaded=False)
              with open('google-review-result.json', 'w') as output:
                  json.dump(result, output, indent=2)
              print(json.dumps(result))
          finally:
              if not committed:
                  edits.delete(packageName=package, editId=edit_id).execute()
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: google-review-result
          path: google-review-result.json
          if-no-files-found: error


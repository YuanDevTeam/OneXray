name: Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Test build scripts
        working-directory: build_scripts
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare generated asset paths
        run: |
          mkdir -p assets/dat
          touch assets/dat/{geoip.dat,geoip.json,geosite.dat,geosite.json,timestamp.txt}

      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run ffigen

      - name: Verify generated sources
        run: git diff --exit-code

      - name: Check format
        run: |
          find lib test tool -name '*.dart' \
            ! -name '*.g.dart' \
            ! -path 'lib/gen/*' \
            ! -path 'lib/l10n/*' \
            ! -path 'lib/core/pigeon/messages.g.dart' \
            ! -path 'lib/core/ffi/generated_bindings.dart' \
            -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Verify layer dependencies
        run: dart run tool/check_layer_dependencies.dart

      - name: Analyze
        run: flutter analyze

      - name: Verify native JSON model contract
        run: dart run tool/check_native_model_contract.dart

      - name: Test
        run: flutter test

      - name: Check whitespace
        run: git diff --check

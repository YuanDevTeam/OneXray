#
# Builds OneXray across all supported platforms.
#
# Trigger:
#   - workflow_dispatch: manually builds all or one operating system
#     (`macos` builds both the MAS and Developer ID variants)
#   - push to a tag matching `v*`: builds release artifacts
#
# Required repository secrets (set under Settings → Secrets and variables → Actions):
#
# Convention: secrets whose value is a file or a multi-line string are stored
# base64-encoded (suffix `_BASE64`) so GitHub's secret editor never mangles
# newlines or whitespace. Simple single-line identifiers / passwords are stored
# as plain strings.
#
#   Apple (iOS / macOS / macos_se):
#     FASTLANE_ASC_KEY_ID               App Store Connect API key id
#     FASTLANE_ASC_ISSUER_ID            ASC issuer id (UUID)
#     FASTLANE_ASC_KEY_BASE64           base64-encoded .p8 contents
#     FASTLANE_MAS_INSTALLER_CERT       full subject of the 3rd Party Mac Developer Installer cert
#     APPLE_DISTRIBUTION_P12_BASE64     base64 of the Apple Distribution .p12
#                                       (shared by iOS and Mac App Store app signing)
#     APPLE_MAC_INSTALLER_P12_BASE64    base64 of the 3rd Party Mac Developer Installer .p12
#     APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64
#                                       base64 of the Developer ID Application .p12
#     KEYCHAIN_PASSWORD                 password used by the .p12 files and temporary build keychain
#
#   Android:
#     ANDROID_KEYSTORE_BASE64           base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD         store password
#     ANDROID_KEY_PASSWORD              key password
#     ANDROID_KEY_ALIAS                 key alias
#     ANDROID_PLAY_SERVICE_JSON_BASE64  base64 of fastlane service account JSON
#
# Layout:
#   build_scripts/app/builder.py#build_core expects XTLS/libXray as a sibling
#   of this repo. Every platform build job checks out this repo to `OneXray/`
#   and libXray to `libXray/` at the workspace root. Windows also checks out
#   Vole to `Vole/`.
#   The standard libXray build provides the native library and the Windows/Linux
#   OneXrayCore binary; Windows also builds architecture-matched Vole UWP hosts.
#   Outputs remain under `<workspace>/output`.

name: Build
run-name: Build ${{ inputs.target || 'all' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Operating system to build
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios
          - macos
          - windows
          - linux
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

env:
  NDK_VERSION: r30
  LIBXRAY_REF: main
  VOLE_REPOSITORY: YuanDevTeam/Vole
  VOLE_REF: main
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # =================================================================
  # Build metadata — records the source and dependency revisions for every
  # build. Tag builds additionally include tag.txt for release validation.
  # =================================================================
  release_metadata:
    runs-on: ubuntu-26.04
    outputs:
      libxray_sha: ${{ steps.libxray.outputs.commit }}
      vole_sha: ${{ steps.vole.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        id: libxray
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v7
        id: vole
        with:
          repository: ${{ env.VOLE_REPOSITORY }}
          ref: ${{ env.VOLE_REF }}
          path: Vole

      - name: Write build metadata
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
          LIBXRAY_SHA: ${{ steps.libxray.outputs.commit }}
          VOLE_SHA: ${{ steps.vole.outputs.commit }}
        run: |
          mkdir -p release-metadata
          echo "${GITHUB_SHA}" > release-metadata/sha.txt
          echo "$LIBXRAY_SHA" > release-metadata/libxray-sha.txt
          echo "$VOLE_SHA" > release-metadata/vole-sha.txt
          echo "$GITHUB_RUN_ID" > release-metadata/run-id.txt
          echo "$GITHUB_RUN_ATTEMPT" > release-metadata/run-attempt.txt
          echo "$GITHUB_REPOSITORY" > release-metadata/repository.txt
          echo "$BUILD_TARGET" > release-metadata/target.txt
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "${GITHUB_REF_NAME}" > release-metadata/tag.txt
          fi

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata/*
          if-no-files-found: error

  # =================================================================
  # iOS — uploads to App Store Connect (TestFlight) via fastlane
  # =================================================================
  ios:
    needs: release_metadata
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'ios'
    runs-on: xcode-27 # macOS 27 ARM64 (public preview)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ needs.release_metadata.outputs.libxray_sha }}
          path: libXray

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.FASTLANE_ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 -d > ios/fastlane/AuthKey.p8

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Verify code signing identities
        run: security find-identity -v -p codesigning

      - name: Build & upload
        env:
          FASTLANE_ASC_KEY_ID: ${{ secrets.FASTLANE_ASC_KEY_ID }}
          FASTLANE_ASC_ISSUER_ID: ${{ secrets.FASTLANE_ASC_ISSUER_ID }}
        run: uv run --project build_scripts python build_scripts/main.py OneXray ios

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: output/OneXray-ios*.ipa
          if-no-files-found: error

  # =================================================================
  # macOS (MAS) — universal binary, uploads to App Store Connect
  # =================================================================
  macos:
    needs: release_metadata
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: xcode-27 # macOS 27 ARM64 (public preview)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ needs.release_metadata.outputs.libxray_sha }}
          path: libXray

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.FASTLANE_ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 -d > macos/fastlane/AuthKey.p8

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Import Mac installer certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_MAC_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp
          create-keychain: false

      - name: Verify code signing identities
        run: security find-identity -v -p codesigning

      - name: Build & upload
        env:
          FASTLANE_ASC_KEY_ID: ${{ secrets.FASTLANE_ASC_KEY_ID }}
          FASTLANE_ASC_ISSUER_ID: ${{ secrets.FASTLANE_ASC_ISSUER_ID }}
          FASTLANE_MAS_INSTALLER_CERT: ${{ secrets.FASTLANE_MAS_INSTALLER_CERT }}
        run: uv run --project build_scripts python build_scripts/main.py OneXray macos

  # =================================================================
  # macOS SE (Developer ID) — universal binary, Developer ID signed
  #   + notarized + zipped
  # =================================================================
  macos_se:
    needs: release_metadata
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: xcode-27 # macOS 27 ARM64 (public preview)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ needs.release_metadata.outputs.libxray_sha }}
          path: libXray

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.FASTLANE_ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 -d > macos_se/fastlane/AuthKey.p8

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Verify code signing identities
        run: security find-identity -v -p codesigning

      - name: Build, notarize & staple
        env:
          FASTLANE_ASC_KEY_ID: ${{ secrets.FASTLANE_ASC_KEY_ID }}
          FASTLANE_ASC_ISSUER_ID: ${{ secrets.FASTLANE_ASC_ISSUER_ID }}
        run: uv run --project build_scripts python build_scripts/main.py OneXray macos_se

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos_se
          path: output/OneXray-macos-universal*.zip
          if-no-files-found: error

  # =================================================================
  # Android — uploads AAB to Play Store via fastlane
  # =================================================================
  android:
    needs: release_metadata
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ needs.release_metadata.outputs.libxray_sha }}
          path: libXray

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Gradle 9.7 supports Java up to 26; Java 27 requires Gradle 9.8.
          java-version: "26"
          check-latest: true

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Install native build dependencies
        # Dart generation runs cnativeapi's Linux host hook before the Android build.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Setup Android NDK
        id: ndk
        # libXray's Android builder invokes `gomobile bind`, which needs an NDK.
        # Pass the installed NDK path explicitly to the build below.
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore Play Store service account
        env:
          PLAY_SA_B64: ${{ secrets.ANDROID_PLAY_SERVICE_JSON_BASE64 }}
        run: echo "$PLAY_SA_B64" | base64 -d > android/fastlane/playservice.json

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/upload.jks
          cat > android/keystore/keystore.properties <<EOF
          storeFile=../keystore/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Install fastlane
        run: sudo gem install fastlane --no-document

      - name: Build & upload
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: uv run --project build_scripts python build_scripts/main.py OneXray android

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-universal
          path: output/OneXray-android-universal*.apk
          if-no-files-found: error

  # =================================================================
  # Windows x64 and arm64 × EXE / MSIX.
  #   EXE and ZIP share an exe-mode bundle; Store uses its own msix-mode build.
  #   x64 uses Windows Server 2025 with Visual Studio 2026; arm64 uses
  #   Windows 11 with Visual Studio 2026 so Flutter, libXray, and Vole
  #   all match the target architecture.
  # =================================================================
  windows:
    needs: release_metadata
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        mode: [exe, msix]
        include:
          - arch: x64
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            package_suffix: windows-amd64
            runner: windows-2025-vs2026
          - arch: arm64
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            package_suffix: windows-arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOARCH: ${{ matrix.goarch }}
      ONEXRAY_WINDOWS_ARCH: ${{ matrix.arch }}
      INNO_SETUP_MAJOR: "7"
    defaults:
      run:
        shell: bash
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ needs.release_metadata.outputs.libxray_sha }}
          path: libXray

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOLE_REPOSITORY }}
          ref: ${{ needs.release_metadata.outputs.vole_sha }}
          path: Vole

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Vole

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Download LLVM-MinGW for Windows ARM64
        if: matrix.arch == 'arm64'
        uses: robinraju/release-downloader@v1
        with:
          repository: mstorsjo/llvm-mingw
          latest: true
          fileName: llvm-mingw-*-ucrt-aarch64.zip
          out-file-path: references/llvm-mingw
          extract: true

      - name: Add LLVM-MinGW to PATH
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:GITHUB_WORKSPACE "references/llvm-mingw"
          $binPath = Get-ChildItem -LiteralPath $extractPath -Directory |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "gcc.exe") } |
            Select-Object -First 1
          if ($null -eq $binPath) {
            throw "LLVM-MinGW bin directory was not found in $extractPath"
          }
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test build scripts
        working-directory: OneXray/build_scripts
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install Fastforge
        if: matrix.mode == 'exe'
        run: dart pub global activate fastforge

      - name: Resolve stable Inno Setup release
        if: matrix.mode == 'exe'
        id: inno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api 'repos/jrsoftware/issrc/releases?per_page=100' | jq -er \
            --arg major "$INNO_SETUP_MAJOR" \
            '[.[] | select(.draft == false and .prerelease == false and
              (.tag_name | test("^is-" + $major + "_[0-9]+_[0-9]+$")))][0].tag_name //
              error("No stable Inno Setup " + $major + " release found")')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="${tag#is-}"
          echo "installer=innosetup-${version//_/.}-x64.exe" >> "$GITHUB_OUTPUT"

      - name: Download Inno Setup
        if: matrix.mode == 'exe'
        uses: robinraju/release-downloader@v1
        with:
          repository: jrsoftware/issrc
          tag: ${{ steps.inno.outputs.tag }}
          fileName: ${{ steps.inno.outputs.installer }}
          out-file-path: references/windows-build

      - name: Install Inno Setup
        if: matrix.mode == 'exe'
        shell: pwsh
        env:
          INNO_INSTALLER: ${{ steps.inno.outputs.installer }}
        run: |
          $toolDir = Join-Path $env:GITHUB_WORKSPACE "references/windows-build"
          $installer = Join-Path $toolDir $env:INNO_INSTALLER
          $installDir = Join-Path $toolDir "inno-setup"
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=`"$installDir`""
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not installed" }
          "INNO_SETUP_PATH=$installDir" >> $env:GITHUB_ENV

      - name: Build
        run: uv run --project build_scripts python build_scripts/main.py OneXray windows --windows-mode ${{ matrix.mode }}

      - name: Upload Microsoft Store artifact
        if: matrix.mode == 'msix'
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-${{ matrix.arch }}
          path: output/OneXray-${{ matrix.package_suffix }}.msix
          if-no-files-found: error

      - name: Upload EXE and ZIP artifacts
        if: matrix.mode == 'exe'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            output/OneXray-${{ matrix.package_suffix }}.exe
            output/OneXray-${{ matrix.package_suffix }}.zip
          if-no-files-found: error

  # =================================================================
  # Linux — fastforge .zip + .deb, x64 and arm64
  #   Pinned to ubuntu-24.04 (x64) / ubuntu-24.04-arm (arm64): the
  #   produced binary's glibc requirement is whatever the runner ships
  #   (glibc 2.39). Upgrading the runner image would silently bump the
  #   minimum glibc users need, so don't use `ubuntu-latest` here.
  #   ubuntu-24.04-arm is GitHub-hosted; free for public repos, paid
  #   for private ones.
  # =================================================================
  linux:
    needs: release_metadata
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ needs.release_metadata.outputs.libxray_sha }}
          path: libXray

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang cmake pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libsecret-1-dev \
            libayatana-appindicator3-dev \
            file

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build
        run: uv run --project build_scripts python build_scripts/main.py OneXray linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            output/OneXray-*.zip
            output/OneXray-*.deb
          if-no-files-found: error

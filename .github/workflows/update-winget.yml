#
# Updates the Windows Package Manager manifest after a OneXray release becomes
# stable. Pre-releases are intentionally ignored.
#
# Trigger:
#   - release released: automatically opens a winget PR after a stable release
#   - workflow_dispatch: manually updates winget for an existing stable release
#
# Required repository secrets:
#   PACKAGE_MANAGER_GITHUB_TOKEN       Classic GitHub PAT with public_repo
#                                      scope and write access to the
#                                      YuanDevTeam/winget-pkgs fork
#

name: Update winget

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag_name:
        description: Stable release tag, for example v26.9.1
        required: true
        type: string

concurrency:
  group: update-winget-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  winget:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      WINGET_IDENTIFIER: YuanDevLLC.OneXray
      WINGET_OUTPUT: references/winget
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          mkdir -p "$WINGET_OUTPUT"
          release="$WINGET_OUTPUT/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release"
          if jq -e '.draft' "$release" >/dev/null; then
            echo "Release $RELEASE_TAG is still a draft." >&2
            exit 1
          fi
          if jq -e '.prerelease' "$release" >/dev/null; then
            echo "Release $RELEASE_TAG is a pre-release; skipping winget update."
            exit 0
          fi
          tag="$(jq -er --arg tag "$RELEASE_TAG" '.tag_name | select(. == $tag and startswith("v") and length > 1)' "$release")"
          for arch in amd64 arm64; do
            url="$(jq -er --arg name "OneXray-windows-$arch.exe" \
              'first(.assets[] | select(.name == $name) | .browser_download_url) // error("Missing release asset: \($name)")' "$release")"
            echo "${arch}_url=$url" >> "$GITHUB_OUTPUT"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.release.outputs.tag != ''
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        if: steps.release.outputs.tag != ''
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Rust
        if: steps.release.outputs.tag != ''
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Komac from main
        if: steps.release.outputs.tag != ''
        # Track upstream main and build with its committed Cargo lockfile.
        uses: baptiste0928/cargo-install@v3
        with:
          crate: komac
          git: https://github.com/russellbanks/Komac
          branch: main
          locked: true

      - name: Generate winget manifests
        id: generate
        if: steps.release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          AMD64_URL: ${{ steps.release.outputs.amd64_url }}
          ARM64_URL: ${{ steps.release.outputs.arm64_url }}
          NO_COLOR: "1"
        run: |
          version="${RELEASE_TAG#v}"
          manifest_dir="$WINGET_OUTPUT/generated/manifests/y/YuanDevLLC/OneXray/$version"
          mkdir -p "$manifest_dir"

          # Komac dry-run prints manifests but returns before handling --output.
          # Split at its generated headers and name each file from its metadata.
          komac update "$WINGET_IDENTIFIER" --version "$version" \
            --dry-run --urls "$AMD64_URL" "$ARM64_URL" \
            | awk -v dir="$manifest_dir" -v id="$WINGET_IDENTIFIER" '
                function save() {
                  if (type == "") return
                  suffix = type == "version" ? "" : (type == "installer" ? ".installer" : ".locale." locale)
                  file = dir "/" id suffix ".yaml"
                  printf "%s", manifest > file
                  close(file)
                }
                { sub(/\r$/, "") }
                /^# Created with / { save(); manifest = ""; type = ""; locale = ""; active = 1 }
                active { manifest = manifest $0 "\r\n" }
                /^ManifestType: / { type = $2 }
                /^PackageLocale: / { locale = $2 }
                END { save() }
              '

          echo "manifest_dir=$manifest_dir" >> "$GITHUB_OUTPUT"

      - name: Fix and validate winget manifests
        if: steps.release.outputs.tag != ''
        env:
          MANIFEST_DIR: ${{ steps.generate.outputs.manifest_dir }}
        run: |
          uv run --script build_scripts/winget_manifest.py fix "$MANIFEST_DIR"
          uv run --script build_scripts/winget_manifest.py validate "$MANIFEST_DIR" \
            --release "$WINGET_OUTPUT/release.json"

      - name: Upload validated manifests
        if: steps.release.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: winget-${{ steps.release.outputs.tag }}
          path: ${{ steps.generate.outputs.manifest_dir }}
          if-no-files-found: error

      - name: Submit validated manifests
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MANAGER_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_MANAGER_GITHUB_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          MANIFEST_DIR: ${{ steps.generate.outputs.manifest_dir }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          fork="$KOMAC_FORK_OWNER/winget-pkgs"
          if [[ "$(gh api "repos/$fork" --jq '.parent.full_name')" != "microsoft/winget-pkgs" ]]; then
            echo "$fork must be a fork of microsoft/winget-pkgs." >&2
            exit 1
          fi
          title="New version: $WINGET_IDENTIFIER version ${RELEASE_TAG#v}"
          existing_pr="$(gh search prs --repo microsoft/winget-pkgs --state open \
            --match title "$title" --json title,url \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .url')"
          if [ -n "$existing_pr" ]; then
            echo "A manifest PR already exists; update it instead of creating a duplicate: $existing_pr" >&2
            exit 1
          fi
          # Sync the fork before Komac creates a branch from upstream HEAD.
          komac sync-fork
          komac submit "$MANIFEST_DIR" --yes
